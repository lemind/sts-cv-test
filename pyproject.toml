[project]
name = "sts-cv-test"
version = "0.1.0"
description = "Dataset validation and a reproducible YOLO experiment logged to TensorBoard"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics==8.4.218",
    "torch==2.15.0",
    "torchvision==0.29.2",
    "tensorboard==2.21.0",
    "pillow==13.0.0",
    "pyyaml==6.0.4",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.6"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
